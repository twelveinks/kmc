<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Template Management</title>
    <link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/vendor/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/img/updfheader.png" alt="Med-Scope Logo">
        </div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="#" onclick="window.close()">Close</a></li>
        </ul>
    </div>
    
    <div class="content">
        <div class="template-container">
            <div class="template-header">
                <h2>Template Management</h2>
                <button class="btn btn-success" onclick="createNewTemplate()">
                    <i class="fas fa-plus mr-2"></i>
                    Create New Template
                </button>
            </div>

            <div class="template-list">
                <!-- Built-in Templates -->
                <div class="template-section">
                    <h3>Built-in Templates</h3>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Referral Form</h5>
                                    <p class="card-text">Standard medical referral template with patient details and reason for referral.</p>
                                    <button class="btn btn-primary" onclick="editTemplate('referral')">Edit Template</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Operation Form</h5>
                                    <p class="card-text">Surgical operation form with pre-op checklist and operation details.</p>
                                    <button class="btn btn-primary" onclick="editTemplate('operation')">Edit Template</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Custom Templates -->
                <div class="template-section">
                    <h3>Custom Templates</h3>
                    <div id="customTemplates" class="row">
                        <!-- Custom templates will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Template Creation Modal -->
    <div class="modal fade" id="templateModal" tabindex="-1" role="dialog" aria-labelledby="templateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="templateModalLabel">Create New Template</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="templateForm">
                        <div class="form-group">
                            <label for="templateName">Template Name</label>
                            <input type="text" class="form-control" id="templateName" required>
                        </div>
                        <div class="form-group">
                            <label for="templateDescription">Description</label>
                            <textarea class="form-control" id="templateDescription" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Fields</label>
                            <div id="fieldsList">
                                <!-- Fields will be added here -->
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="addField()">
                                <i class="fas fa-plus"></i> Add Field
                            </button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveTemplate()">Save Template</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../assets/vendor/bootstrap/js/bootstrap.js"></script>
    <script>
        function createNewTemplate() {
            $('#templateModal').modal('show');
        }

        function addField() {
            const fieldHtml = `
                <div class="field-item mb-3">
                    <div class="row">
                        <div class="col-md-4">
                            <input type="text" class="form-control" placeholder="Field Label">
                        </div>
                        <div class="col-md-3">
                            <select class="form-control">
                                <option value="text">Text</option>
                                <option value="textarea">Text Area</option>
                                <option value="date">Date</option>
                                <option value="number">Number</option>
                                <option value="checkbox">Checkbox</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control" placeholder="Default Value">
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.parentElement.remove()">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('fieldsList').insertAdjacentHTML('beforeend', fieldHtml);
        }

        function saveTemplate() {
            // Save template logic will be implemented
            $('#templateModal').modal('hide');
        }

        function editTemplate(templateId) {
            // Edit template logic will be implemented
        }

        // Load custom templates
        function loadCustomTemplates() {
            // Template loading logic will be implemented
        }

        // Load templates when page loads
        document.addEventListener('DOMContentLoaded', loadCustomTemplates);
    </script>
</body>
</html>
