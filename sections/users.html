<link rel="stylesheet" href="../assets/vendor/font-awesome/css/font-awesome.min.css">
<style>
    :root {
        --primary-color: #FF9933;
        --secondary-color: #e88826;
        --success-color: #47d185;
        --warning-color: #ffd93d;
        --danger-color: #ff6b6b;
        --gray-100: #f5f5f5;
        --gray-200: #e9ecef;
        --gray-300: #dee2e6;
        --gray-400: #ced4da;
        --gray-500: #adb5bd;
        --gray-600: #6c757d;
        --gray-700: #495057;
        --gray-800: #343a40;
        --gray-900: #212529;
    }

    body {
        background-color: var(--gray-100);
        min-height: 100vh;
    }

    .underline {
        border-bottom: 4px solid var(--primary-color);
        padding-bottom: 2px;
    }
    
    .header-section {
        background: white;
        padding: 25px 30px;
        margin-bottom: 25px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        border-radius: 10px;
        color: #333;
    }
    
    .header-section h2 {
        margin: 0;
        display: inline-block;
        font-weight: normal;
        font-size: 28px;
        font-family: 'Segoe UI', sans-serif;
        color: #363636;
    }
    
    .header-section h2 i {
        margin-right: 12px;
        opacity: 0.9;
    }
    
    .back-button {
        float: right;
        background-color: var(--primary-color);
        border: none;
        color: white;
        transition: all 0.3s ease;
        padding: 12px 28px;
        border-radius: 4px;
        font-family: 'Segoe UI', sans-serif;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 160px;
    }
    
    .back-button:hover {
        transform: translateY(-1px);
        background-color: var(--secondary-color);
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .content-section {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    }

    .search-container {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 25px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        position: relative;
    }
    
    .search-area {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 300px;
    }
    
    .button-area {
        width: calc(100% - 320px);
    }
    
    .btn {
        border-radius: 4px;
        padding: 12px 25px;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: 'Segoe UI', sans-serif;
        font-size: 14px;
    }

    .btn-success {
        background-color: var(--primary-color);
        border: none;
        color: white;
    }

    .btn-success:hover {
        background-color: var(--secondary-color);
        transform: translateY(-1px);
    }

    .form-control {
        height: 45px;
        padding: 10px 15px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 4px;
        transition: border-color 0.2s ease;
    }

    .form-control:focus {
        border-color: var(--primary-color);
        outline: 0;
        box-shadow: 0 0 0 2px rgba(255, 153, 51, 0.2);
    }

    .table {
        margin-bottom: 0;
        width: 100%;
        background: white;
        border-radius: 8px;
        overflow: hidden;
    }

    .table th {
        background: #f8f8f8;
        color: #333;
        font-weight: normal;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        padding: 15px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        border-bottom: 2px solid #eee;
        text-align: left;
        font-family: 'Segoe UI', sans-serif;
    }

    .table th:hover {
        background: #f0f0f0;
    }

    .table th i.fa-sort,
    .table th i.fa-sort-up,
    .table th i.fa-sort-down {
        margin-left: 5px;
        opacity: 0.7;
    }

    .table td {
        padding: 15px;
        vertical-align: middle;
        border-bottom: 1px solid var(--gray-200);
        transition: all 0.3s ease;
    }

    .table tbody tr {
        transition: all 0.3s ease;
    }

    .table tbody tr:hover {
        background-color: var(--gray-100);
    }

    .table tbody tr:last-child td {
        border-bottom: none;
    }

    .username-cell {
        color: #1a3c6e;
        font-weight: 500;
        font-family: 'Segoe UI', sans-serif;
    }

    .user-name-cell {
        font-weight: normal;
        color: #363636;
        font-family: 'Segoe UI', sans-serif;
    }

    .btn {
        border-radius: 4px;
        padding: 10px 20px;
        font-weight: normal;
        transition: all 0.3s ease;
        font-family: 'Segoe UI', sans-serif;
        font-size: 14px;
        min-width: 100px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
    }

    .btn i {
        font-size: 14px;
    }

    .btn-sm {
        padding: 8px 16px;
        font-size: 13px;
        min-width: auto;
    }

    .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .btn-group {
        display: flex;
        gap: 8px;
    }

    .btn-primary {
        background-color: var(--primary-color);
        color: white;
    }

    .btn-success {
        background-color: #2ecc71;
        color: white;
        padding: 12px 24px;
    }

    .btn-success:hover {
        background-color: #27ae60;
    }

    .btn-warning {
        background-color: var(--warning-color);
        color: var(--gray-800);
    }

    .btn-danger {
        background-color: #e74c3c;
        color: white;
    }

    .btn-danger:hover {
        background-color: #c0392b;
    }

    .form-control {
        border: 2px solid var(--gray-200);
        border-radius: 8px;
        padding: 8px 12px;
        transition: all 0.3s ease;
        font-size: 0.95rem;
    }

    .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
    }

    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
    }
    
    .modal-overlay.show {
        display: flex;
    }
    
    .modal-content-custom {
        background: white;
        padding: 0;
        border-radius: 10px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        animation: slideDown 0.3s ease;
    }
    
    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .modal-header-custom {
        background: var(--primary-color);
        color: white;
        padding: 20px 25px;
        border-radius: 10px 10px 0 0;
        font-family: 'Segoe UI', sans-serif;
    }

    .modal-header-custom h5 {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        font-weight: normal;
        font-size: 20px;
    }
    
    .modal-body-custom {
        padding: 25px;
        font-family: 'Segoe UI', sans-serif;
    }
    
    .modal-footer-custom {
        padding: 20px 25px;
        border-top: 1px solid var(--gray-200);
        background-color: var(--gray-100);
        border-radius: 0 0 12px 12px;
    }

    .alert {
        border-radius: 8px;
        border: none;
        padding: 15px 20px;
        font-weight: 500;
        margin-bottom: 20px;
    }

    .alert-success {
        background-color: rgba(71, 209, 133, 0.1);
        color: var(--success-color);
        border-left: 4px solid var(--success-color);
    }

    .alert-danger {
        background-color: rgba(255, 107, 107, 0.1);
        color: var(--danger-color);
        border-left: 4px solid var(--danger-color);
    }

    .loading-spinner {
        text-align: center;
        padding: 40px;
        color: var(--gray-500);
    }

    .table-empty-message {
        text-align: center;
        padding: 40px;
        color: var(--gray-600);
    }

    .table-empty-message i {
        font-size: 2rem;
        margin-bottom: 15px;
        color: var(--gray-400);
    }
</style>

<div class="container-fluid p-4">
    <div class="header-section">
        <h2><i class="fa fa-users"></i> <span class="underline">User</span> Management</h2>
        <button class="btn back-button" onclick="goToDashboard()">
            <i class="fa fa-arrow-left"></i> Back to Dashboard
        </button>
    </div>
    
    <div class="search-container">
        <div class="button-area">
            <button class="btn btn-success" onclick="showUserForm()">
                <i class="fa fa-plus"></i> Add New User
            </button>
            <div id="statusMessage" class="alert mt-3" style="display: none;"></div>
        </div>
        <div class="search-area">
            <div class="input-group">
                <input type="text" class="form-control" id="searchInput" placeholder="Search users..." onkeyup="filterUsers()">
                <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()">
                    <i class="fa fa-times"></i>
                </button>
            </div>
        </div>
    </div>
    
    <div class="content-section">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th onclick="sortUsers('userName')">
                            <i class="fa fa-user"></i> Username 
                            <i class="fa fa-sort" id="sortIcon-userName"></i>
                        </th>
                        <th onclick="sortUsers('name')">
                            <i class="fa fa-id-card"></i> Name 
                            <i class="fa fa-sort" id="sortIcon-name"></i>
                        </th>
                        <th style="width: 200px;">
                            <i class="fa fa-cogs"></i> Actions
                        </th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="3">
                            <div class="loading-spinner">
                                <i class="fa fa-spinner fa-spin fa-2x"></i>
                                <p class="mt-3">Loading users...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Reset Password Modal -->
<div class="modal-overlay" id="resetPasswordModal">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5><i class="fa fa-key"></i> Reset Password</h5>
        </div>
        <div class="modal-body-custom">
            <p>Reset password for: <strong id="resetUserName"></strong></p>
            <div class="form-group mb-3">
                <label>New Password *</label>
                <input type="password" class="form-control" id="newPassword" required>
            </div>
            <div class="form-group mb-3">
                <label>Confirm Password *</label>
                <input type="password" class="form-control" id="confirmPassword" required>
            </div>
        </div>
        <div class="modal-footer-custom" style="text-align: right; padding-top: 15px; border-top: 1px solid #dee2e6;">
            <button type="button" class="btn btn-secondary" onclick="hideResetPasswordModal()">
                <i class="fa fa-times"></i> Cancel
            </button>
            <button type="button" class="btn btn-primary" onclick="confirmPasswordReset()">
                <i class="fa fa-key"></i> Reset Password
            </button>
        </div>
    </div>
</div>

<!-- User Form Modal -->
<div class="modal-overlay" id="userModal">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5 id="userFormTitle"><i class="fa fa-user-plus"></i> Add New User</h5>
        </div>
        <div class="modal-body-custom">
            <form id="userForm" onsubmit="return false;">
                <div class="form-group mb-3">
                    <label>Username *</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="form-group mb-3">
                    <label>First Name *</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>
                <div class="form-group mb-3">
                    <label>Last Name *</label>
                    <input type="text" class="form-control" id="lastName" required>
                </div>
                <div class="form-group mb-3" id="passwordGroup">
                    <label>Password *</label>
                    <input type="password" class="form-control" id="password">
                    <small class="text-muted">Leave blank when editing to keep existing password</small>
                </div>
            </form>
        </div>
        <div class="modal-footer-custom" style="text-align: right; padding-top: 15px; border-top: 1px solid #dee2e6;">
            <button type="button" class="btn btn-secondary" onclick="hideUserForm()">
                <i class="fa fa-times"></i> Cancel
            </button>
            <button type="button" class="btn btn-primary" onclick="saveUser()">
                <i class="fa fa-save"></i> Save
            </button>
        </div>
    </div>
</div>

<script>
    const _data = require('../lib/data');
    const helpers = require('../lib/helpers');

    let editingUsername = null;
    let allUsers = []; // Store all users for filtering
    let currentSort = { column: 'userName', direction: 'asc' };

    function goToDashboard() {
        window.location.href = 'dashboard.html';
    }

    function loadUsers() {
        _data.list('users', function(err, usernames) {
            if (!err && usernames && usernames.length > 0) {
                let loaded = 0;
                allUsers = [];
                
                usernames.forEach(function(username) {
                    _data.read('users', username, function(err, userData) {
                        loaded++;
                        if (!err && userData) {
                            // Hide admin and Leslie accounts
                            if (userData.userName !== 'admin' && userData.userName !== 'Leslie') {
                                allUsers.push(userData);
                            }
                        }
                        
                        if (loaded === usernames.length) {
                            renderUsers(allUsers);
                        }
                    });
                });
            } else {
                allUsers = [];
                renderUsers(allUsers);
            }
        });
    }

    function renderUsers(users) {
        // Sort users
        users.sort((a, b) => {
            let aVal, bVal;
            if (currentSort.column === 'name') {
                aVal = `${a.firstName} ${a.lastName}`.toLowerCase();
                bVal = `${b.firstName} ${b.lastName}`.toLowerCase();
            } else {
                aVal = a[currentSort.column].toLowerCase();
                bVal = b[currentSort.column].toLowerCase();
            }
            if (currentSort.direction === 'asc') {
                return aVal.localeCompare(bVal);
            } else {
                return bVal.localeCompare(aVal);
            }
        });

        // Update sort icons
        document.getElementById('sortIcon-userName').className = currentSort.column === 'userName' ? 
            (currentSort.direction === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down') : 'fa fa-sort';
        document.getElementById('sortIcon-name').className = currentSort.column === 'name' ? 
            (currentSort.direction === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down') : 'fa fa-sort';

        const tbody = document.getElementById('usersTableBody');
        let content = '';
        
        if (users.length > 0) {
            content = users.map(user => `
                <tr data-username="${user.userName}">
                    <td class="username-cell">
                        <i class="fa fa-user"></i> ${user.userName}
                    </td>
                    <td class="user-name-cell">
                        <i class="fa fa-id-card"></i> ${user.firstName} ${user.lastName}
                    </td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-primary" onclick="editUserInline('${user.userName}')" title="Edit User">
                                <i class="fa fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="showResetPasswordModal('${user.userName}')" title="Reset Password">
                                <i class="fa fa-key"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser('${user.userName}')" title="Delete User">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        } else {
            content = `
                <tr>
                    <td colspan="3">
                        <div class="table-empty-message">
                            <i class="fa fa-users d-block"></i>
                            <p>No users found. Click "Add New User" to create one.</p>
                        </div>
                    </td>
                </tr>
            `;
        }
        tbody.innerHTML = content;
    }

    function sortUsers(column) {
        if (currentSort.column === column) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.column = column;
            currentSort.direction = 'asc';
        }
        filterUsers(); // Re-filter and render
    }

    function filterUsers() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filteredUsers = allUsers.filter(user => 
            user.userName.toLowerCase().includes(searchTerm) ||
            user.firstName.toLowerCase().includes(searchTerm) ||
            user.lastName.toLowerCase().includes(searchTerm)
        );
        renderUsers(filteredUsers);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        renderUsers(allUsers);
    }

    function showStatusMessage(message, type = 'success') {
        const statusDiv = document.getElementById('statusMessage');
        statusDiv.textContent = message;
        statusDiv.className = `alert alert-${type} mt-3`;
        statusDiv.style.display = 'block';
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);
    }

    function showUserForm(isEdit = false) {
        document.getElementById('userFormTitle').textContent = isEdit ? 'Edit User' : 'Add New User';
        if (!isEdit) {
            document.getElementById('userForm').reset();
            document.getElementById('username').disabled = false;
            document.getElementById('password').required = true;
            editingUsername = null;
        } else {
            document.getElementById('username').disabled = true;
            document.getElementById('password').required = false;
        }
        document.getElementById('userModal').classList.add('show');
    }

    function hideUserForm() {
        document.getElementById('userModal').classList.remove('show');
        document.getElementById('userForm').reset();
        editingUsername = null;
    }

    function editUserInline(username) {
        // Protect admin and Leslie accounts
        if (username === 'admin' || username === 'Leslie') {
            showStatusMessage('Cannot edit protected account', 'danger');
            return;
        }
        
        const row = document.querySelector(`tr[data-username="${username}"]`);
        const cells = row.querySelectorAll('td');
        
        // Store original values
        const originalUsername = cells[0].textContent.replace('user', '').trim();
        const originalName = cells[1].textContent.replace('id-card', '').trim();
        const [firstName, lastName] = originalName.split(' ');
        
        // Replace cells with inputs
        cells[0].innerHTML = `
            <input type="text" class="form-control form-control-sm" value="${originalUsername}" disabled>
        `;
        cells[1].innerHTML = `
            <div class="d-flex gap-2">
                <input type="text" class="form-control form-control-sm" value="${firstName || ''}" id="inlineFirstName" placeholder="First Name">
                <input type="text" class="form-control form-control-sm" value="${lastName || ''}" id="inlineLastName" placeholder="Last Name">
            </div>
        `;
        cells[2].innerHTML = `
            <div class="btn-group">
                <button class="btn btn-sm btn-success" onclick="saveInline('${username}')" title="Save">
                    <i class="fa fa-save"></i>
                </button>
                <button class="btn btn-sm btn-secondary" onclick="cancelInline('${username}', '${originalUsername}', '${firstName}', '${lastName}')" title="Cancel">
                    <i class="fa fa-times"></i>
                </button>
            </div>
        `;
    }

    function saveInline(username) {
        const firstName = document.getElementById('inlineFirstName').value.trim();
        const lastName = document.getElementById('inlineLastName').value.trim();
        
        if (!firstName || !lastName) {
            showStatusMessage('Please fill in all required fields', 'danger');
            return;
        }
        
        _data.read('users', username, function(err, existingData) {
            if (!err && existingData) {
                existingData.firstName = firstName;
                existingData.lastName = lastName;
                
                _data.update('users', username, existingData, function(err) {
                    if (!err) {
                        showStatusMessage('User updated successfully', 'success');
                        loadUsers(); // Reload to refresh the table
                    } else {
                        showStatusMessage('Error updating user', 'danger');
                    }
                });
            } else {
                showStatusMessage('Error reading user data', 'danger');
            }
        });
    }

    function cancelInline(username, originalUsername, firstName, lastName) {
        const row = document.querySelector(`tr[data-username="${username}"]`);
        const cells = row.querySelectorAll('td');
        
        // Restore the cells
        cells[0].innerHTML = `
            <i class="fa fa-user"></i> ${originalUsername}
        `;
        cells[1].innerHTML = `
            <i class="fa fa-id-card"></i> ${firstName} ${lastName}
        `;
        cells[2].innerHTML = `
            <div class="btn-group">
                <button class="btn btn-sm btn-primary" onclick="editUserInline('${username}')" title="Edit User">
                    <i class="fa fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-warning" onclick="showResetPasswordModal('${username}')" title="Reset Password">
                    <i class="fa fa-key"></i>
                </button>
                <button class="btn btn-sm btn-danger" onclick="deleteUser('${username}')" title="Delete User">
                    <i class="fa fa-trash"></i>
                </button>
            </div>
        `;
    }

    function saveUser() {
        const username = document.getElementById('username').value.trim();
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !firstName || !lastName) {
            showStatusMessage('Please fill in all required fields', 'danger');
            return;
        }

        if (!editingUsername && !password) {
            showStatusMessage('Password is required for new users', 'danger');
            return;
        }

        const userData = {
            userName: username,
            firstName: firstName,
            lastName: lastName,
            tosAgreement: true
        };

        if (password) {
            userData.password = helpers.hash(password);
        }

        if (editingUsername) {
            // Editing existing user
            _data.read('users', editingUsername, function(err, existingData) {
                if (!err && existingData) {
                    // Keep existing password if not provided
                    if (!password) {
                        userData.password = existingData.password;
                    }
                    
                    _data.update('users', editingUsername, userData, function(err) {
                        if (!err) {
                            showStatusMessage('User updated successfully', 'success');
                            hideUserForm();
                            loadUsers();
                        } else {
                            showStatusMessage('Error updating user', 'danger');
                        }
                    });
                } else {
                    showStatusMessage('Error reading existing user data', 'danger');
                }
            });
        } else {
            // Creating new user
            _data.create('users', username, userData, function(err) {
                if (!err) {
                    showStatusMessage('User created successfully', 'success');
                    hideUserForm();
                    loadUsers();
                } else {
                    showStatusMessage('Username already exists', 'danger');
                }
            });
        }
    }

    function deleteUser(username) {
        // Protect admin and Leslie accounts
        if (username === 'admin' || username === 'Leslie') {
            showStatusMessage('Cannot delete protected account', 'danger');
            return;
        }
        
        if (confirm('Are you sure you want to delete user "' + username + '"? This action cannot be undone.')) {
            _data.delete('users', username, function(err) {
                if (!err) {
                    showStatusMessage('User deleted successfully', 'success');
                    loadUsers();
                } else {
                    showStatusMessage('Error deleting user', 'danger');
                }
            });
        }
    }

    function showResetPasswordModal(username) {
        // Protect admin and Leslie accounts
        if (username === 'admin' || username === 'Leslie') {
            showStatusMessage('Cannot reset password for protected accounts', 'danger');
            return;
        }
        
        editingUsername = username;
        document.getElementById('resetUserName').textContent = username;
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        document.getElementById('resetPasswordModal').classList.add('show');
    }

    function hideResetPasswordModal() {
        document.getElementById('resetPasswordModal').classList.remove('show');
        editingUsername = null;
    }

    function confirmPasswordReset() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!newPassword || !confirmPassword) {
            alert('Please fill in both password fields');
            return;
        }

        if (newPassword !== confirmPassword) {
            alert('Passwords do not match');
            return;
        }

        if (newPassword.length < 4) {
            alert('Password must be at least 4 characters long');
            return;
        }

        _data.read('users', editingUsername, function(err, userData) {
            if (!err && userData) {
                userData.password = helpers.hash(newPassword);
                
                _data.update('users', editingUsername, userData, function(err) {
                    if (!err) {
                        hideResetPasswordModal();
                        showStatusMessage('Password reset successfully', 'success');
                    } else {
                        showStatusMessage('Error resetting password', 'danger');
                    }
                });
            } else {
                showStatusMessage('Error loading user data', 'danger');
            }
        });
    }

    // Load users when the page loads
    setTimeout(() => {
        loadUsers();
    }, 100);
</script>
